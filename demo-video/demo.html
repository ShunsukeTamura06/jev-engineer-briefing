<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>LLM vs Decision Model</title>
<style>
:root{--ink:#1d1d1f;--ink-2:#6e6e73;--line:#d2d2d7;--bg:#fff;--bg-2:#f5f5f7;--blue:#0066cc;--blue-soft:#b8d4f0;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;overflow:hidden}
body{font-family:"Yu Gothic Medium","Yu Gothic",YuGothic,"Hiragino Sans",Meiryo,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;padding:44px 64px;display:flex;flex-direction:column}
.src{background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:18px 26px}
.src .k{font-size:22px;color:var(--ink-2);display:flex;justify-content:space-between}
.src .t{font-size:26px;line-height:1.55;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q{font-size:26px;margin:18px 4px 0;color:var(--ink-2)}
.q b{color:var(--ink)}.opt{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:2px 20px;margin-left:10px;color:var(--ink);background:#fff}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:22px;flex:1;min-height:0}
.panel{border:1.5px solid var(--line);border-radius:22px;padding:26px 34px;display:flex;flex-direction:column;position:relative;background:#fff}
.panel.dm{border-color:var(--blue-soft);background:#f7fbff}
.hd{display:flex;justify-content:space-between;align-items:baseline}
.hd h3{margin:0;font-size:40px;letter-spacing:-.02em}.hd h3 small{display:block;font-size:22px;font-weight:400;color:var(--ink-2);margin-top:2px;letter-spacing:0}
.dm .hd h3{color:var(--blue)}
.timer{font-size:92px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--ink-2)}
.timer small{font-size:36px;font-weight:600;margin-left:6px}
.timer.run{color:var(--ink)}.timer.done{color:var(--ink)}.dm .timer.done{color:var(--blue)}
.body{flex:1;margin-top:14px;min-height:0;position:relative}
.stream{font-size:30px;line-height:1.7;white-space:pre-wrap}
.cur{display:inline-block;width:.5em;height:1em;background:var(--ink);vertical-align:-.12em;margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.verdict{display:none;margin-top:10px;font-size:34px;font-weight:700}
.verdict span{background:var(--ink);color:#fff;border-radius:12px;padding:4px 22px;margin-left:10px}
.bars{display:flex;flex-direction:column;gap:30px;margin-top:20px}
.bar{display:grid;grid-template-columns:190px 1fr 150px;white-space:nowrap;align-items:center;gap:18px;font-size:38px;font-weight:600;opacity:0;transition:opacity .2s}
.bars.show .bar{opacity:1}
.track{height:54px;background:#e6eef7;border-radius:12px;overflow:hidden}
.fill{height:100%;width:0;background:var(--blue-soft);border-radius:12px;transition:width .35s ease-out}
.bar.win .fill{background:var(--blue)}.bar .pc{text-align:right;font-variant-numeric:tabular-nums}.bar.win{color:var(--blue)}
.wait{font-size:30px;color:var(--ink-2)}
.foot{height:120px;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:34px;font-size:56px;font-weight:700;opacity:0;transition:opacity .5s}
.foot.show{opacity:1}.foot .x{color:var(--blue);font-size:72px}.foot .vs{font-size:34px;font-weight:500;color:var(--ink-2)}
.note{position:absolute;right:64px;bottom:10px;font-size:18px;color:var(--ink-2)}
</style></head><body>
<div id="stage">
  <div class="src"><div class="k"><span id="srcname"></span><span id="srclen"></span></div><div class="t" id="stmt"></div></div>
  <div class="q"><b>問い</b>　金融政策のスタンスは？<span id="opts"></span></div>
  <div class="cols">
    <div class="panel"><div class="hd"><h3>LLM<small>理由を書いてから結論（Chat API）</small></h3><div class="timer" id="t1">0.00<small>秒</small></div></div>
      <div class="body"><div class="stream" id="stream"></div><div class="verdict" id="verdict">結論<span id="vtxt"></span></div></div></div>
    <div class="panel dm"><div class="hd"><h3>Decision Model<small>確率だけ返す</small></h3><div class="timer" id="t2">0.00<small>秒</small></div></div>
      <div class="body"><div class="wait" id="wait"></div><div class="bars" id="bars"></div></div></div>
  </div>
  <div class="foot" id="foot"></div>
  <div class="note" id="note"></div>
</div>
<script src="demo_data.js"></script>
<script>
(function(){
var D = window.DEMO;
function $(i){ return document.getElementById(i); }
function fit(){ var s = Math.min(innerWidth/1920, innerHeight/1080); $('stage').style.transform = 'scale(' + s + ')'; }
addEventListener('resize', fit); fit();

$('srcname').textContent = '日本銀行　2026年9月18日「金融市場調節方針の変更について」　本文4・5段落';
$('srclen').textContent = D.statement.length.toLocaleString() + '字';
$('stmt').textContent = D.statement;
$('opts').innerHTML = D.options.map(function(o){ return '<span class="opt">' + o + '</span>'; }).join('');
$('note').textContent = 'LLM は OpenAI ' + D.model + '（API）・同時に実行・画面の時間は実測値（' + D.runs + '回計測の中央値の回）';
$('bars').innerHTML = D.options.map(function(o){
  return '<div class="bar" data-o="' + o + '"><span>' + o + '</span><div class="track"><div class="fill"></div></div><span class="pc">0%</span></div>';
}).join('');

function fmt(x){ return x.toFixed(2) + '<small>秒</small>'; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
var START = 1500, HOLD = 4500;
var T0, text, ci, dmDone, llmDone, footDone, shownAt;

function reset(){
  T0 = null; text = ''; ci = 0; dmDone = llmDone = footDone = false;
  $('t1').className = 'timer'; $('t2').className = 'timer';
  $('t1').innerHTML = fmt(0); $('t2').innerHTML = fmt(0);
  $('verdict').style.display = 'none'; $('stream').innerHTML = ''; $('wait').textContent = '実行を待っています…';
  $('bars').className = 'bars'; $('foot').className = 'foot';
  Array.prototype.forEach.call($('bars').children, function(b){
    b.className = 'bar'; b.querySelector('.fill').style.width = '0'; b.querySelector('.pc').textContent = '0%';
  });
  window.demoLoops = (window.demoLoops || 0) + 1;
}

function frame(now){
  if (T0 === null) T0 = now;
  var el = now - T0;
  if (el >= START) {
    var t = (el - START) / 1000;
    // 左：LLM（記録したチャンクを、到着した時刻どおりに表示）
    while (ci < D.llm.chunks.length && D.llm.chunks[ci].t <= t) { text += D.llm.chunks[ci].text; ci++; }
    var shown = text;
    if (!llmDone) {
      if (t >= D.llm.elapsed) {
        llmDone = true; $('t1').className = 'timer done'; $('t1').innerHTML = fmt(D.llm.elapsed);
        var m = text.match(/結論[：:]\s*(\S+)\s*$/);
        $('verdict').style.display = 'block'; $('vtxt').textContent = m ? m[1] : '';
      } else { $('t1').className = 'timer run'; $('t1').innerHTML = fmt(t); }
    }
    if (llmDone) { var m2 = text.match(/^([\s\S]*?)\s*結論[：:]\s*\S+\s*$/); if (m2) shown = m2[1]; }
    $('stream').innerHTML = esc(shown) + (llmDone ? '' : '<span class="cur"></span>');
    // 右：Decision Model（確率が返った時刻に一度に表示）
    if (!dmDone) {
      if (t >= D.decision.elapsed) {
        dmDone = true; $('t2').className = 'timer done'; $('t2').innerHTML = fmt(D.decision.elapsed);
        $('wait').textContent = ''; $('bars').className = 'bars show';
        Array.prototype.forEach.call($('bars').children, function(b){
          var o = b.getAttribute('data-o'), p = D.decision.probs[o] || 0;
          b.querySelector('.fill').style.width = (p * 100) + '%';
          b.querySelector('.pc').textContent = Math.round(p * 100) + '%';
          if (o === D.decision.choice) b.className = 'bar win';
        });
      } else { $('t2').className = 'timer run'; $('t2').innerHTML = fmt(t); $('wait').textContent = '判定中…'; }
    }
    if (llmDone && dmDone && !footDone) {
      footDone = true; shownAt = el;
      var r = D.llm.elapsed / D.decision.elapsed;
      $('foot').innerHTML = '<span>' + D.decision.elapsed.toFixed(2) + ' 秒</span><span class="vs">対</span><span>' +
        D.llm.elapsed.toFixed(2) + ' 秒</span><span class="x">約' + Math.round(r) + '倍の差</span>';
      $('foot').className = 'foot show';
    }
    if (footDone && el - shownAt > HOLD) reset();
  }
  requestAnimationFrame(frame);
}
reset();
addEventListener('keydown', function(e){ if (e.key === 'r' || e.key === 'R') reset(); });  // R で頭出し（録画の撮り直し用）
requestAnimationFrame(frame);
})();
</script></body></html>
